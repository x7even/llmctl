# llmstack model registry
# llama-swap docs: https://github.com/mostlygeek/llama-swap
#
# How routing works:
#   Client sends:  POST /v1/chat/completions  {"model": "qwen3.8-27b-code", ...}
#   llama-swap:    looks up the profile, starts the backend if needed, proxies
#
# To add a model:
#   1. Add a new entry under `models:`
#   2. Set cmd to the podman run invocation (newlines = whitespace, ${PORT} is auto-assigned)
#   3. Set cmdStop to `podman stop llmstack-<backend>-${MODEL_ID}`
#   4. Run: llmctl list  (to verify it appears)
#      Then: llmctl swap <profile>  (to load and warm it up)
#
# Backend naming convention:
#   llmstack-vllm-<profile>   ← vLLM containers  (safetensors / FP8 / AWQ)
#   llmstack-llama-<profile>  ← llama-server containers  (GGUF)
#
# Image pinning: every vLLM profile uses the same pinned tag
#   docker.io/vllm/vllm-openai-rocm:v0.26.0
# Never reference the moving :latest tag. Version bumps happen deliberately —
# canary first, then update all refs at once (validation record and bench
# results: docs/upgrade-plan-2026-07.md). v0.31.0 was canaried in 2026-10 and held
# back — conc=8/16 decode is 6-9% below v0.26.0 (docs/upgrade-plan-2026-10.md).
# Rollback anchor: localhost/vllm-openai-rocm:v0.22.1-baseline stays on disk —
# revert a profile by swapping its ref back.
# CLIENT NOTE: vLLM 0.24.0 renames the chat reasoning field from
# message.reasoning_content to message.reasoning — adapt clients that parse it.

healthCheckTimeout: 2100  # seconds; conservative ceiling, not the expected wait — measured
# v0.26.0 first boots (4 profiles, 2026-07-27) all landed at ~2-3 min (see CLAUDE.md
# "vLLM cold start"). Kept high as headroom for profiles not covered by that measurement
# (dense 27B, long contexts). Warm starts ~2-3 min.
startPort: 9100           # llama-swap assigns backends ports starting here
globalTTL: 0              # 0 = never auto-unload (set per-model below)

models:

  # ─── vLLM: Qwen3.8-27B FP8 — the default model family ───────────────────
  # Official Qwen/Qwen3.8-27B-FP8 (released 2026-08-14, Apache 2.0) — 30.9 GB
  # incl. bundled mtp.safetensors. Dense 27B, 262144 native context, vision.
  # Three profiles share one checkpoint and differ only in MTP and the
  # server-side default chat-template kwargs (every one can still be
  # overridden per request via chat_template_kwargs):
  #   qwen3.8-27b-code   MTP + thinking (medium effort)  — interactive / coding
  #   qwen3.8-27b-think  no MTP + thinking (medium)      — parallel agent fleets
  #   qwen3.8-27b-fast   MTP + thinking off              — quick answers, bulk
  # The template's own default is reasoning_effort=xhigh, which on this model
  # produces very long or runaway think blocks; medium finishes our code tasks
  # in 2-8k tokens, so the thinking profiles default to medium.
  qwen3.8-27b-code:
    name: "Qwen3.8-27B FP8 (code, MTP, thinking)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - qwen3.8
      - 27b-3.8
      - qwen3.8-27b
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.8-27B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.8-27b-code
        --dtype auto
        --tensor-parallel-size 4
        --max-model-len 131072
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --gpu-memory-utilization 0.95
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
        --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Qwen3.8-27B FP8 — thinking, no MTP (parallel agent fleets) ────
  # Same as qwen3.8-27b-code without speculative decoding. MTP helps a single
  # stream but its draft/verify work costs throughput once the batch is full;
  # use this profile when many agents run at once.
  qwen3.8-27b-think:
    name: "Qwen3.8-27B FP8 (thinking, no MTP)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - 27b-think
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.8-27B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.8-27b-think
        --dtype auto
        --tensor-parallel-size 4
        --max-model-len 131072
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --gpu-memory-utilization 0.95
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Qwen3.8-27B FP8 — thinking off, MTP (quick answers, bulk) ─────
  qwen3.8-27b-fast:
    name: "Qwen3.8-27B FP8 (fast, MTP, no thinking)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - 27b-fast
      - qwen3.8-nothink
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.8-27B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.8-27b-fast
        --dtype auto
        --tensor-parallel-size 4
        --max-model-len 131072
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --gpu-memory-utilization 0.95
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --default-chat-template-kwargs '{"enable_thinking": false}'
        --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Qwen3.6-35B-A3B FP8 — previous generation, MTP + thinking ────
  # Best for: Claude Code, OpenCode, agentic coding — highest quality output
  # Backend: vLLM via pinned AMD official image (see header pin)
  # VRAM:    ~35 GB across 4 GPUs + ~3 GB MTP draft head overhead (~9.5 GB each)
  # MTP:     speculative decoding via bundled mtp.safetensors draft head
  #          Mathematically lossless — main model verifies all tokens
  #          Pre-MTP baseline (no-thinking): serial=43, conc=8=261, conc=16=481 tok/s
  # Context: 131072 tokens (BF16 KV — no FP8 calibration, fast cold start ~2-3 min)
  # Note:    thinking ON by default; --reasoning-parser strips <think> from content
  #          Uses AMD official image — Qwen3_5MoeForConditionalGeneration requires 0.22.1+
  qwen3.6-35b-code:
    name: "Qwen3.6-35B-A3B-FP8 (code)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - qwen3.6
      - qwen3.6-35b
      - qwen3.6-35b-fp8
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.6-35B-A3B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.6-35b-code
        --dtype auto
        --tensor-parallel-size 4
        --enable-expert-parallel
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --max-model-len 131072
        --gpu-memory-utilization 0.92
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --speculative-config '{"method": "mtp", "num_speculative_tokens": 2}'
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Qwen3.6-35B-A3B FP8 — 128K, no MTP (high-concurrency serving) ───
  # Same as qwen3.6-35b-code but WITHOUT speculative decoding. Measured on
  # vLLM 0.24.0 (2026-07-07, this hardware): at concurrency 8 no-MTP is faster
  # than MTP (329.7 vs 312.4 output tok/s) with far better inter-token latency
  # (ITL p50 19.0 vs 49.5 ms). MTP wins single-stream (69.0 vs ~59 tok/s
  # baseline). Use this profile for parallel agent fleets; use the MTP profile
  # for single-user interactive sessions. Bench: docs/upgrade-plan-2026-07.md.
  # Note: switching between MTP and no-MTP invalidates the vLLM compile-cache
  # match — expect a ~16 min warm start on the first swap between them.
  qwen3.6-35b-128k-nomtp:
    name: "Qwen3.6-35B-A3B-FP8 (128K, no MTP — high concurrency)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - 35b-nomtp
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.6-35B-A3B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.6-35b-128k-nomtp
        --dtype auto
        --tensor-parallel-size 4
        --enable-expert-parallel
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --max-model-len 131072
        --gpu-memory-utilization 0.92
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Qwen3.6-35B-A3B FP8 — Fast profile (thinking OFF, max throughput) ─
  # Best for: quick lookups, chat, tasks where latency matters more than depth
  # Key difference: thinking disabled by default (no reasoning overhead)
  #   Custom template config/templates/qwen3.6-no-think.jinja inverts the default
  #   so thinking=off unless client explicitly passes enable_thinking=true
  # VRAM:    ~35 GB across 4 GPUs (~8.75 GB each) — full 0.97 utilisation
  # Benchmark (thinking off, no-MTP, medium-256): serial=69, conc=8=222 tok/s
  #   (no-MTP vs the code profile's MTP — throughput reflects the FP8 no-MTP baseline)
  qwen3.6-35b-fast:
    name: "Qwen3.6-35B-A3B-FP8 (fast)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 64
    aliases:
      - qwen3.6-fast
      - qwen3.6-nothin
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/config/templates:/templates:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/Qwen3.6-35B-A3B-FP8
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name qwen3.6-35b-fast
        --dtype auto
        --tensor-parallel-size 4
        --enable-expert-parallel
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --kv-cache-dtype fp8
        --gpu-memory-utilization 0.97
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --chat-template /templates/qwen3.6-no-think.jinja
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── llama-server: Qwen3.8-Flash-Next UD-IQ4_XS GGUF (125B / 6B active) ──
  # Best for: strongest single-user agentic coding that fits in 128 GB
  # Backend: llama-server (Vulkan) built from Unsloth's qwen4exp/mtp llama.cpp
  #          fork (upstream cannot load arch `qwen4exp`); image is
  #          localhost/llmstack-llama-qwen4exp:6fcaa16 (containers/llama-server-qwen4exp)
  # Weights: 93.7 GB (UD-IQ4_XS, 3 shards) + 2.8 GB MTP draft head, split across 4 GPUs
  # Model:   /mnt/models/llm/unsloth/Qwen3.8-Flash-Next-GGUF/
  # Note:    Experimental on gfx1201. Exclusive VRAM: unload other models first.
  #          262144 ctx / 2 slots = 131072 per slot (~79 GB VRAM total at 262K/4 slots).
  #          Layer-split decode does not scale with concurrency: 4 streams ran ~8.5 tok/s
  #          each vs ~50 tok/s single, hence 2 slots.
  qwen3.8-flash-next:
    name: "Qwen3.8-Flash-Next (UD-IQ4_XS, MTP)"
    ttl: 0
    checkEndpoint: /health
    concurrencyLimit: 4
    aliases:
      - flash-next
      - qwen3.8-flash
    cmd: |
      podman run --replace --rm
        --name llmstack-llama-qwen38-flash-next
        --device=/dev/dri
        --group-add keep-groups
        --network=host
        -v /mnt/models/llm:/models:ro
        localhost/llmstack-llama-qwen4exp:6fcaa16
        -m /models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
        -md /models/unsloth/Qwen3.8-Flash-Next-GGUF/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
        --spec-type draft-mtp
        --spec-draft-n-max 3
        -ngl 999
        --tensor-split 1,1,1,1
        --host 127.0.0.1
        --port ${PORT}
        --ctx-size 262144
        --parallel 2
        --batch-size 1024
        --ubatch-size 512
        --cache-type-k q8_0
        --cache-type-v q8_0
        --flash-attn on
        --jinja
    cmdStop: podman stop llmstack-llama-qwen38-flash-next

  # ─── llama-server: Gemma 4 26B-A4B Q8_0 GGUF (vision-capable) ──────────
  # Best for: multimodal tasks (image+text), strong general reasoning, vision QA
  # Only vision-capable profile in the stack — loads mmproj alongside the GGUF
  # Architecture: MoE with 26B total weights / 4B active params per token
  #   → fast decode despite Q8 size; comparable active-param cost to the Qwen3 MoEs
  # Backend: llama-server (Vulkan) — NOT vLLM (multimodal GGUF not supported in vLLM)
  # VRAM:    ~26 GB total ÷ 4 GPUs = ~6.5 GB each; generous KV cache headroom
  # Model:   /mnt/models/llm/lmstudio-community/gemma-4-26B-A4B-it-GGUF/
  gemma4-26b-q8:
    name: "Gemma 4 26B-A4B (Q8_0 + Vision)"
    ttl: 43200
    checkEndpoint: /health
    concurrencyLimit: 16
    aliases:
      - gemma4
      - gemma4-26b
      - gemma4-moe
      - gemma4-vision
    cmd: |
      podman run --replace --rm
        --name llmstack-llama-${MODEL_ID}
        --device=/dev/dri
        --group-add keep-groups
        --network=host
        -v /mnt/models/llm:/models:ro
        localhost/llmstack-llama:latest
        -m /models/lmstudio-community/gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-Q8_0.gguf
        --mmproj /models/lmstudio-community/gemma-4-26B-A4B-it-GGUF/mmproj-gemma-4-26B-A4B-it-BF16.gguf
        -ngl 999
        --tensor-split 1,1,1,1
        --host 127.0.0.1
        --port ${PORT}
        --ctx-size 32768
        --batch-size 1024
        --ubatch-size 512
        --parallel 16
        --cache-type-k q8_0
        --cache-type-v q8_0
        --jinja
    cmdStop: podman stop llmstack-llama-${MODEL_ID}

  # ─── llama-server: Gemma 4 12B Q4_K_M GGUF (lightweight vision) ─────────
  # Best for: quick vision tasks, low-latency image QA, VRAM-constrained use
  # Lowest VRAM footprint with vision capability in the stack
  # VRAM:    ~7 GB total ÷ 4 GPUs = ~1.75 GB each — can co-load with other models
  # Note:    Model not yet downloaded; path follows lmstudio-community convention
  gemma4-12b-q4:
    name: "Gemma 4 12B (Q4_K_M + Vision)"
    ttl: 43200
    checkEndpoint: /health
    concurrencyLimit: 16
    aliases:
      - gemma4-12b
      - gemma4-small
      - gemma4-fast
    cmd: |
      podman run --replace --rm
        --name llmstack-llama-${MODEL_ID}
        --device=/dev/dri
        --group-add keep-groups
        --network=host
        -v /mnt/models/llm:/models:ro
        localhost/llmstack-llama:latest
        -m /models/lmstudio-community/gemma-4-12B-it-GGUF/gemma-4-12B-it-Q4_K_M.gguf
        --mmproj /models/lmstudio-community/gemma-4-12B-it-GGUF/mmproj-gemma-4-12B-it-BF16.gguf
        -ngl 999
        --tensor-split 1,1,1,1
        --host 127.0.0.1
        --port ${PORT}
        --ctx-size 32768
        --batch-size 1024
        --ubatch-size 512
        --parallel 16
        --cache-type-k q8_0
        --cache-type-v q8_0
        --jinja
    cmdStop: podman stop llmstack-llama-${MODEL_ID}

  # ─── vLLM: Gemma 4 26B-A4B BF16 — high-concurrency agent serving ────────
  # Best for: concurrent agent workloads hitting Gemma 4 in parallel
  # Architecture: MoE, 26B total / 4B active params → fast decode at high concurrency
  # Backend: vLLM via pinned AMD official image (see header pin) (ROCm 7.2)
  # VRAM:    ~52 GB BF16 ÷ 4 GPUs = ~13 GB each; ~76 GB free for KV cache
  # Note:    No --reasoning-parser (Gemma 4 IT has no thinking mode by default)
  #          No --kv-cache-dtype fp8 (BF16 model; leave KV at default bf16)
  #          No --enable-expert-parallel (not tested/supported for Gemma 4 MoE on vLLM)
  #          No --speculative-config (no MTP head bundled with base checkpoint)
  #          --tool-call-parser gemma4: dedicated parser for Gemma 4's non-JSON
  #          wire format (<|tool_call>call:func{...}<tool_call|>) — NOT "pythonic"
  #          Model path: /models/google/gemma-4-26B-A4B-it (HF org/repo layout)
  #          Note: model not yet downloaded to /mnt/models/llm/google/
  gemma4-26b-a4b:
    name: "Gemma 4 26B-A4B (BF16, vLLM)"
    ttl: 43200
    checkEndpoint: /health
    concurrencyLimit: 32
    aliases:
      - gemma4-vllm
      - gemma4-concurrent
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/google/gemma-4-26B-A4B-it
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name gemma4-26b-a4b
        --dtype auto
        --tensor-parallel-size 4
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --gpu-memory-utilization 0.92
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --enable-auto-tool-choice
        --tool-call-parser gemma4
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

  # ─── vLLM: Gemma 4 26B-A4B FP8-Dynamic — long-context agent serving ─────
  # Best for: long-context coding sessions where O(N) attention is the bottleneck
  # Architecture: MoE (26B total / 128 experts / top_k=8 ≈ 4B active per token)
  #   Layer types: 25 sliding_attention (window=1024) + 5 full_attention (every 6th)
  #   At 20K context, reads only ~21% of KV vs a full-attention model of the same
  #   size — the 25 sliding layers always cost 1024 tokens regardless of ctx length
  # Backend: vLLM via pinned AMD official image (see header pin) (ROCm 7.2)
  # VRAM:    ~26 GB FP8 weights + BF16 KV cache across 4 GPUs
  # Source:  RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic (weights+activations FP8)
  # Note:    No --kv-cache-dtype fp8 (BF16 KV avoids calibration; ~2x VRAM per KV token)
  #          No --reasoning-parser (no thinking mode); --tool-call-parser gemma4
  #          No --enable-expert-parallel (not confirmed supported for Gemma 4 MoE)
  gemma4-26b-fp8:
    name: "Gemma 4 26B-A4B (FP8 weights, BF16 KV)"
    ttl: 43200
    checkEndpoint: /health
    concurrencyLimit: 32
    aliases:
      - gemma4-fp8
      - gemma4-fast-vllm
    cmd: |
      podman run --replace --rm
        --name llmstack-vllm-${MODEL_ID}
        --device=/dev/kfd
        --device=/dev/dri
        --group-add keep-groups
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --ipc=private
        --shm-size=32g
        --network=host
        -v /mnt/models/llm:/models:ro
        -v /home/xin/ai/llmstack/.vllm-cache:/root/.cache/vllm
        -v /home/xin/ai/llmstack/.triton-cache:/root/.triton/cache
        -e HSA_ENABLE_SDMA=0
        -e TORCH_BLAS_PREFER_HIPBLASLT=1
        --entrypoint=""
        docker.io/vllm/vllm-openai-rocm:v0.26.0
        vllm serve /models/RedHatAI/gemma-4-26B-A4B-it-FP8-Dynamic
        --host 127.0.0.1
        --port ${PORT}
        --served-model-name gemma4-26b-fp8
        --dtype auto
        --tensor-parallel-size 4
        --max-num-seqs 32
        --max-num-batched-tokens 32768
        --max-model-len 262144
        --gpu-memory-utilization 0.92
        --enable-prefix-caching
        --enable-chunked-prefill
        --trust-remote-code
        --enable-auto-tool-choice
        --tool-call-parser gemma4
        --cudagraph-capture-sizes 1 2 4 8 16 32
    cmdStop: podman stop llmstack-vllm-${MODEL_ID}

